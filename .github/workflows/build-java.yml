name: CI Pipeline for Java Application

# 1. Disparador (Trigger) en Pull Requests hacia main
on:
  pull_request:
    branches: [ "main" ]

# Configuración de permisos necesarios para publicar en GHCR
permissions:
  contents: read
  packages: write

jobs:
  # JOB 1: Construcción (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java y Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar proyecto
        run: ./gradlew bootJar -x test

      - name: Guardar artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: build/libs/*-SNAPSHOT.jar

  # JOB 2: Pruebas (Test) - Depende de 'build'
  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: store
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java y Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ejecutar pruebas unitarias
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/ecommerce
          SPRING_DATASOURCE_USERNAME: store
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

  # JOB 3: Publicación en GHCR - Depende de 'test'
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Descargar artefacto JAR
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          path: build/libs

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Formatear nombre del repositorio
        id: repo_name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
